name: Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Android project
        working-directory: artifacts/photovault
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Configure release version and signing
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > artifacts/photovault/android/app/release.keystore
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/artifacts/photovault/android/app/release.keystore" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require('node:fs');
          const appPath = 'artifacts/photovault/app.json';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          if (process.env.RELEASE_VERSION) {
            app.expo.version = process.env.RELEASE_VERSION.replace(/^v/, '');
          }
          app.expo.android.versionCode = Number(process.env.ANDROID_VERSION_CODE);
          fs.writeFileSync(appPath, `${JSON.stringify(app, null, 2)}\n`);

          const gradlePath = 'artifacts/photovault/android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          gradle = gradle.replace(/versionCode\s+1\b/, `versionCode ${process.env.ANDROID_VERSION_CODE}`);
          if (process.env.RELEASE_VERSION) {
            const versionName = process.env.RELEASE_VERSION.replace(/^v/, '');
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${versionName}"`);
          }
          const signingConfigEnd = '        }\n    }\n    buildTypes {';
          if (!gradle.includes(signingConfigEnd)) {
            throw new Error('Could not locate the generated Android signing configuration.');
          }
          gradle = gradle.replace(signingConfigEnd, `        }
          release {
              storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
              storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
              keyAlias System.getenv('ANDROID_KEY_ALIAS')
              keyPassword System.getenv('ANDROID_KEY_PASSWORD')
          }
      }
      buildTypes {`);
          const releaseBuildType = gradle.lastIndexOf('signingConfig signingConfigs.debug');
          if (releaseBuildType < 0) {
            throw new Error('Could not locate the generated release build signing setting.');
          }
          gradle = gradle.slice(0, releaseBuildType)
            + 'signingConfig signingConfigs.release'
            + gradle.slice(releaseBuildType + 'signingConfig signingConfigs.debug'.length);
          fs.writeFileSync(gradlePath, gradle);
          NODE

      - name: Build signed APK
        working-directory: artifacts/photovault/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Name APK
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'preview' }}
        run: cp artifacts/photovault/android/app/build/outputs/apk/release/app-release.apk "PhotoVault-${RELEASE_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVault-Android-APK
          path: PhotoVault-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "PhotoVault-${GITHUB_REF_NAME}.apk" --title "PhotoVault ${GITHUB_REF_NAME}" --generate-notes
